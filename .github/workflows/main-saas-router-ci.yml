name: Main SaaS Router CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/main/saas-router-v1, fix/main/all-industries-code-complete]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check demo-static/js/auth-redirect.js
          node --check demo-static/js/saas-router.js
          node --check demo-static/js/session-handoff.js
          node --check demo-static/js/platform-addons.js
          node --check demo-static/api/industry-asset.js
          node --check demo-static/js/grocery-runtime-preflight.js
          node --check demo-static/js/grocery-phase4-31-40.js
          node --check demo-static/js/grocery-phase5-41-50.js
          node --check demo-static/js/grocery-phase5-completion.js
          node --check demo-static/js/grocery-dashboard-format-hotfix.js
          node --check demo-static/js/grocery-phase5-print-profile-v2.js
          node --check demo-static/js/grocery-phase6-51-62.js
          node --check demo-static/js/grocery-render-race-guard.js
          node --check demo-static/js/grocery-report-race-hotfix.js
          node --check demo-static/js/grocery-sidebar-hotfix.js
          node --check tests/grocery-31-40-frontend.test.cjs
          node --check tests/grocery-41-50-frontend.test.cjs
          node --check tests/grocery-51-62-frontend.test.cjs
          node --check tests/grocery-sidebar-drawer.test.cjs
          node --check tests/grocery-live-runtime-regressions.test.cjs
          node --check tests/grocery-render-race-guard.test.cjs
          node --check tests/grocery-report-race-hotfix.test.cjs
          node --check tests/authenticated-production.e2e.mjs
          node --check scripts/certify-all-industry-code.mjs
      - name: SaaS router release suite
        run: node tests/main-saas-router.test.cjs
      - name: Industry asset gateway suite
        run: node tests/industry-asset-gateway.test.cjs
      - name: Shared platform add-ons suite
        run: node tests/platform-addons.test.cjs
      - name: Grocery requirements 31-40 certification
        run: node tests/grocery-31-40-frontend.test.cjs
      - name: Grocery requirements 41-50 certification
        run: node tests/grocery-41-50-frontend.test.cjs
      - name: Grocery requirements 51-62 certification
        run: node tests/grocery-51-62-frontend.test.cjs
      - name: Grocery responsive sidebar certification
        run: node tests/grocery-sidebar-drawer.test.cjs
      - name: Grocery live runtime regression certification
        run: node tests/grocery-live-runtime-regressions.test.cjs
      - name: Grocery stale-render navigation certification
        run: node tests/grocery-render-race-guard.test.cjs
      - name: Grocery report race certification
        run: node tests/grocery-report-race-hotfix.test.cjs
      - name: All-industry branch code certification
        run: node scripts/certify-all-industry-code.mjs
      - name: Upload code-certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-industry-code-certification
          path: all-industry-code-certification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Vercel configuration
        run: node -e "const v=JSON.parse(require('fs').readFileSync('demo-static/vercel.json','utf8')); if(v.git?.deploymentEnabled?.['fix/*']!==false) process.exit(1); console.log('Vercel configuration valid and feature deployment disabled')"
      - name: Reject operational links from central landing
        run: |
          if grep -E 'href="(terminal|sales|products|inventory|industry)\.html' demo-static/saas-index.html; then
            echo "Operational application link detected on central landing" >&2
            exit 1
          fi
      - name: Reject permanent token URL transfer
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['demo-static/js/saas-router.js','demo-static/js/session-handoff.js'];
          const source=files.map(file=>fs.readFileSync(file,'utf8')).join('\n');
          if (/searchParams\.set\(\s*["']token["']/i.test(source) || /[?&]token=/i.test(source)) {
            console.error('Permanent token URL transfer detected');
            process.exit(1);
          }
          console.log('PASS: no permanent token URL transfer');
          NODE
