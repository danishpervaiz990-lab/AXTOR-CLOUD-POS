name: Hardware Frontend CI
on:
  pull_request:
    branches: [frontend-hardware]
  push:
    branches: [frontend-hardware, fix/hardware/dedicated-frontend-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check demo-static/js/axtor-api.js
          node --check demo-static/js/hardware-app.js
          node --check demo-static/js/hardware-print-settings-backend.js
          node --check demo-static/js/hardware-document-router.js
      - name: Hardware release suite
        run: node tests/hardware-frontend.test.cjs
      - name: Reject generic industry routes
        run: |
          if grep -R "industry.html?module=" demo-static/hardware-*.html; then exit 1; fi
      - name: Verify Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('demo-static/vercel.json','utf8')); console.log('Vercel configuration valid')"
