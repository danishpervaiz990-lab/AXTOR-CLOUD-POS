name: Grocery Production Final Pass

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/grocery-production-final-pass.yml']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Grocery production files
        run: |
          node --check demo-static/js/grocery-browser-compat.js
          node --check demo-static/js/grocery-new.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live Grocery production certification
        env:
          FRONTEND: https://axtorpos.vercel.app/apps/grocery
          BACKEND: https://axtor-cloud-pos-production.up.railway.app
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('node:crypto');
          const frontend=process.env.FRONTEND, backend=process.env.BACKEND;
          async function api(path,{method='GET',body,headers={}}={}){const r=await fetch(backend+path,{method,cache:'no-store',headers:{Accept:'application/json',...(body!==undefined?{'Content-Type':'application/json'}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(`${method} ${path} HTTP ${r.status}: ${j?.error?.message||j?.message||j?.error||'failed'}`);return j?.data??j;}
          async function noError(page,label){if(await page.locator('.notice-error').count())throw new Error(`${label}: ${await page.locator('.notice-error').first().innerText()}`);const body=await page.locator('body').innerText();if(/LOCAL_GROCERY_DATABASE_DISABLED_USE_SHARED_BACKEND|Application not found|Internal Server Error|Cannot connect to the AXTOR backend|Route not found:/i.test(body))throw new Error(`${label} contains runtime failure`);}
          (async()=>{
            const catalog=await api('/api/v1/public/catalog');
            const plans=Array.isArray(catalog?.plans)?catalog.plans:[];
            const plan=plans.find(p=>String(p.code||'').toLowerCase()==='professional')||plans.find(p=>p.isRecommended)||plans[0];
            if(!plan?.code)throw new Error('No active plan');
            const tag=`${Date.now()}-${crypto.randomBytes(3).toString('hex')}`,email=`grocery.final.${tag}@example.test`,password=`GroceryFinal!${crypto.randomBytes(14).toString('base64url')}9aA`;
            const reg=await api('/api/v1/public/register',{method:'POST',headers:{'Idempotency-Key':`grocery-final:${tag}`},body:{businessName:`Grocery Final ${tag}`,ownerName:'Grocery Final Owner',email,password,country:'QA',timezone:'Asia/Qatar',baseCurrency:'QAR',language:'en',industryCode:'grocery',planCode:String(plan.code).toLowerCase(),billingCycle:'MONTHLY',firstBranch:'Main Branch',firstWarehouse:'Main Warehouse',firstCounter:'Counter 1',taxSystem:'none',taxLabel:'Tax',invoicePrefix:'GRC',printProfile:'a4',pricesIncludeTax:false,sampleDataRequested:false,acceptTerms:true,acceptPrivacy:true}});
            const workspace=String(reg?.business?.slug||'').trim();if(!workspace)throw new Error('No Grocery workspace returned');
            const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1000}});const failed=[],pageErrors=[],consoleErrors=[];page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText}`));page.on('pageerror',e=>pageErrors.push(e.message));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const entry=await page.goto(frontend,{waitUntil:'networkidle',timeout:60000});if(!entry||entry.status()!==200)throw new Error(`Entry HTTP ${entry?.status()}`);await page.getByText('Enter your grocery workspace.').waitFor({timeout:20000});const initial=await page.locator('body').innerText();if(/^\s*Hello\s*$/i.test(initial)||!initial.includes('AXTOR Grocery'))throw new Error('New Grocery replacement not rendered');
            await page.locator('#workspace').fill(workspace);await page.locator('#email').fill(email);await page.locator('#password').fill(password);await page.getByRole('button',{name:'Sign in securely'}).click();await page.getByRole('heading',{name:'Grocery Dashboard'}).waitFor({timeout:20000});await noError(page,'Dashboard');
            const evidence=await page.evaluate(async({backend,tag})=>{const token=localStorage.getItem('axtorAuthToken');const base={Accept:'application/json',Authorization:`Bearer ${token}`};async function call(path,opt={}){const r=await fetch(backend+path,{cache:'no-store',...opt,headers:{...base,...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(`${opt.method||'GET'} ${path} HTTP ${r.status}: ${j?.error?.message||j?.message||j?.error||'failed'}`);return j?.data??j;}const me=await call('/api/v1/auth/me');if((me?.business?.industryCode||me?.business?.industry?.code)!=='grocery')throw new Error('Authenticated tenant is not Grocery');let a=await call('/api/v1/accounts?active=true');let accounts=Array.isArray(a)?a:(Array.isArray(a?.accounts)?a.accounts:[]);let account=accounts.find(x=>x.active!==false)||accounts[0];if(!account?.id){account=await call('/api/v1/accounts',{method:'POST',body:JSON.stringify({name:'Grocery Cheque Bank',type:'bank',bankName:'AXTOR Test Bank',currency:'QAR',openingBalance:0,active:true})});}if(!account?.id)throw new Error('Could not create Grocery cheque payment account');const now=new Date(),due=new Date(now.getTime()+7*86400000),chequeNumber=`LIVE-${tag}`;const created=await call('/api/v1/grocery/cheques',{method:'POST',headers:{'Idempotency-Key':`grocery-cheque:${tag}`},body:JSON.stringify({direction:'inward',paymentAccountId:account.id,chequeNumber,bankName:'AXTOR Test Bank',amount:125.50,currencyCode:'QAR',chequeDate:now.toISOString(),dueDate:due.toISOString(),notes:'Live Grocery production certification'})});const reminders=await call('/api/v1/grocery/cheques/reminders/generate',{method:'POST',body:JSON.stringify({days:30})});const list=await call('/api/v1/grocery/cheques');const cheques=Array.isArray(list?.cheques)?list.cheques:(Array.isArray(list)?list:[]);if(!cheques.some(c=>c.chequeNumber===chequeNumber))throw new Error('Created cheque missing');if(Number(list?.summary?.dueWithin30Days||0)<1)throw new Error('Upcoming cheque tally failed');if(Number(reminders?.created||0)+Number(reminders?.unchanged||0)<1)throw new Error('Cheque reminder generation failed');return{chequeNumber,createdId:created?.id};},{backend,tag});
            for(const [nav,heading] of [['Checkout','Grocery Checkout'],['Inventory','Grocery Inventory'],['Finance','Grocery Finance'],['Cheques','Grocery Cheques'],['Dashboard','Grocery Dashboard']]){await page.locator('.nav-link',{hasText:nav}).click();await page.getByRole('heading',{name:heading}).waitFor({timeout:30000});await page.waitForTimeout(500);await noError(page,heading);if(heading==='Grocery Cheques'){await page.getByText(evidence.chequeNumber).waitFor({timeout:10000});if(!(await page.locator('body').innerText()).includes('Upcoming'))throw new Error('Cheque UI did not flag Upcoming');}}
            if(pageErrors.length)throw new Error(`Page errors: ${pageErrors.join(' | ')}`);if(consoleErrors.length)throw new Error(`Console errors: ${consoleErrors.join(' | ')}`);if(failed.length)throw new Error(`Failed requests: ${failed.join(' | ')}`);await browser.close();console.log('GROCERY PRODUCTION FINAL CERTIFICATION: PASS');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
