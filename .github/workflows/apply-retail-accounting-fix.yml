name: Apply Retail Accounting Fix

on:
  pull_request:
    branches: [backend]
    types: [opened, reopened]
    paths:
      - "backend/scripts/apply-retail-accounting-fix.py"
      - ".github/workflows/apply-retail-accounting-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: axtor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d axtor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/axtor_ci?schema=public
      AUTH_TOKEN_SECRET: ci-only-not-a-production-secret-0123456789
      NODE_ENV: test
      RUN_DATABASE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply atomic source changes
        run: python backend/scripts/apply-retail-accounting-fix.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and validate
        working-directory: backend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed:catalog
          npm run build
          npm test
          npm run verify:start

      - name: Commit validated fixes
        run: |
          git config user.name "axtor-audit-bot"
          git config user.email "axtor-audit-bot@users.noreply.github.com"
          git add backend/src/services/retail-accounting.helpers.ts \
                  backend/src/services/shifts.service.ts \
                  backend/src/services/reports.service.ts \
                  backend/src/controllers/sales-documents.controller.ts \
                  backend/src/controllers/payments.controller.ts \
                  backend/src/controllers/refunds.controller.ts \
                  backend/tests/retail-accounting-regressions.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(retail): reconcile shifts, receipts, refunds and returns"
          git push origin HEAD:${{ github.head_ref }}
