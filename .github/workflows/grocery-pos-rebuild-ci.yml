name: Grocery Shared Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/grocery-pos/**"
      - "docs/grocery/**"
      - ".github/workflows/grocery-pos-rebuild-ci.yml"
  push:
    branches: [feat/grocery-shared-backend-20260806]
    paths:
      - "apps/grocery-pos/**"
      - "docs/grocery/**"
      - ".github/workflows/grocery-pos-rebuild-ci.yml"

permissions:
  contents: read

concurrency:
  group: grocery-shared-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/grocery-pos
    env:
      # Transitional only. The migration audit fails until all runtime database dependencies are removed.
      GROCERY_DATABASE_URL: postgresql://migration_only:migration_only@127.0.0.1:5432/migration_only
      AXTOR_SHARED_BACKEND_URL: https://axtor-cloud-pos-production.up.railway.app
      NEXT_PUBLIC_AXTOR_SHARED_BACKEND_URL: https://axtor-cloud-pos-production.up.railway.app
      GROCERY_SESSION_SECRET: ci-session-secret-that-is-longer-than-thirty-two-characters
      GROCERY_APP_URL: http://localhost:3000
      GROCERY_ENVIRONMENT: test
      GROCERY_LOG_LEVEL: error
      GROCERY_CRON_SECRET: ci-cron-secret-that-is-longer-than-twenty-four-characters
      GROCERY_FILE_STORAGE_PROVIDER: vercel-blob
      GROCERY_EMAIL_FROM_NAME: AXTOR Grocery POS Cloud CI
      GROCERY_EMAIL_FROM_ADDRESS: no-reply@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Grocery dependencies
        run: npm install --no-audit --no-fund

      - name: Generate transitional Prisma client
        run: npm run prisma:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Audit complete shared-backend migration
        run: node scripts/audit-shared-backend-migration.mjs

      - name: Enforce shared-backend deployment architecture
        working-directory: .
        run: |
          test ! -f apps/grocery-pos/railway.toml
          if grep -RInE "release:railway|start:railway|dedicated Railway service|Shared AXTOR backend dependency: none" apps/grocery-pos --exclude-dir=node_modules; then
            echo "Obsolete dedicated Grocery Railway architecture detected"
            exit 1
          fi
          test -f apps/grocery-pos/lib/shared-backend.ts
          test -f apps/grocery-pos/app/api/shared/[...path]/route.ts

      - name: Validate Vercel configuration
        run: node -e "const value=JSON.parse(require('fs').readFileSync('vercel.json','utf8')); if(value.framework!=='nextjs') process.exit(1); console.log('Vercel config valid')"

      - name: Production build
        run: npm run build
