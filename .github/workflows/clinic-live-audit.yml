name: Clinic Live Production Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [backend]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/scripts/qa-clinic-live-audit.mjs"
      - "backend/scripts/qa-clinic-browser-audit.mjs"
      - ".github/workflows/clinic-live-audit.yml"

permissions:
  contents: read

jobs:
  clinic-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AXTOR_PUBLIC_ORIGIN: https://axtorpos.vercel.app
      AXTOR_BACKEND_ORIGIN: https://axtor-cloud-pos-production.up.railway.app
      AXTOR_CLINIC_BUSINESS_SLUG: ${{ secrets.AXTOR_CLINIC_BUSINESS_SLUG }}
      AXTOR_CLINIC_OWNER_EMAIL: ${{ secrets.AXTOR_CLINIC_OWNER_EMAIL }}
      AXTOR_CLINIC_OWNER_PASSWORD: ${{ secrets.AXTOR_CLINIC_OWNER_PASSWORD }}
      AXTOR_CLINIC_RECEPTIONIST_EMAIL: ${{ secrets.AXTOR_CLINIC_RECEPTIONIST_EMAIL }}
      AXTOR_CLINIC_RECEPTIONIST_PASSWORD: ${{ secrets.AXTOR_CLINIC_RECEPTIONIST_PASSWORD }}
      AXTOR_CLINIC_DOCTOR_EMAIL: ${{ secrets.AXTOR_CLINIC_DOCTOR_EMAIL }}
      AXTOR_CLINIC_DOCTOR_PASSWORD: ${{ secrets.AXTOR_CLINIC_DOCTOR_PASSWORD }}
      AXTOR_CLINIC_NURSE_EMAIL: ${{ secrets.AXTOR_CLINIC_NURSE_EMAIL }}
      AXTOR_CLINIC_NURSE_PASSWORD: ${{ secrets.AXTOR_CLINIC_NURSE_PASSWORD }}
      AXTOR_CLINIC_CASHIER_EMAIL: ${{ secrets.AXTOR_CLINIC_CASHIER_EMAIL }}
      AXTOR_CLINIC_CASHIER_PASSWORD: ${{ secrets.AXTOR_CLINIC_CASHIER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate Clinic audit scripts
        run: |
          node --check backend/scripts/qa-clinic-live-audit.mjs
          node --check backend/scripts/qa-clinic-browser-audit.mjs

      - name: Run Clinic API and role audit
        id: transaction_audit
        continue-on-error: true
        run: node backend/scripts/qa-clinic-live-audit.mjs

      - name: Read Clinic audit preflight
        id: preflight
        if: always()
        run: |
          test -s clinic-live-audit-report.json
          node - <<'NODE'
          const fs = require('fs');
          const report = require('./clinic-live-audit-report.json');
          const configured = report?.configuration?.businessSlug === true && report?.configuration?.fiveUsersConfigured === true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `configured=${configured}\n`);
          console.log(configured
            ? 'Clinic credentials are configured; browser certification will run.'
            : 'Clinic credentials are not configured; expensive browser steps are skipped and the strict gate remains FAIL.');
          NODE

      - name: Install browser runtime
        if: steps.preflight.outputs.configured == 'true' && hashFiles('clinic-live-audit-runtime.json') != ''
        run: |
          mkdir -p /tmp/axtor-playwright
          npm init -y --prefix /tmp/axtor-playwright >/dev/null
          npm install --prefix /tmp/axtor-playwright playwright@1.55.0 --no-audit --no-fund
          /tmp/axtor-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Test five roles through live Clinic frontend
        if: steps.preflight.outputs.configured == 'true' && hashFiles('clinic-live-audit-runtime.json') != ''
        continue-on-error: true
        run: node backend/scripts/qa-clinic-browser-audit.mjs

      - name: Encrypt Clinic credentials
        if: steps.preflight.outputs.configured == 'true' && hashFiles('clinic-live-audit-credentials.json') != '' && hashFiles('backend/scripts/retail-audit-recipient-cert.pem') != ''
        run: |
          openssl cms -encrypt -binary -aes-256-cbc \
            -in clinic-live-audit-credentials.json \
            -out clinic-live-audit-credentials.p7m \
            -outform DER \
            backend/scripts/retail-audit-recipient-cert.pem
          test -s clinic-live-audit-credentials.p7m
          shred -u clinic-live-audit-credentials.json clinic-live-audit-runtime.json

      - name: Remove plaintext Clinic runtime on blocked runs
        if: always() && hashFiles('clinic-live-audit-credentials.json') != ''
        run: shred -u clinic-live-audit-credentials.json clinic-live-audit-runtime.json

      - name: Upload Clinic audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-live-audit-${{ github.run_id }}
          path: |
            clinic-live-audit-report.json
            clinic-live-audit-credentials.p7m
            clinic-live-audit-cleanup.sql
            clinic-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Clinic launch-readiness result
        if: always()
        run: |
          test -s clinic-live-audit-report.json
          node - <<'NODE'
          const fs = require('fs');
          const report = require('./clinic-live-audit-report.json');
          console.log('Clinic audit result:', report.overall);
          if (report.overall === 'PASS' && !fs.existsSync('clinic-live-audit-credentials.p7m')) {
            console.error('Clinic audit cannot PASS without an encrypted credential artifact.');
            process.exit(1);
          }
          if (report.overall !== 'PASS') process.exit(1);
          NODE
