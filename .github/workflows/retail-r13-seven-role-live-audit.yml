name: Retail R-13 Seven-Role Live Audit

on:
  pull_request:
    branches: [backend]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/scripts/debug-retail-audit-cashier-source.mjs"
      - ".github/workflows/retail-r13-seven-role-live-audit.yml"

permissions:
  contents: read

jobs:
  retail-r13-seven-role-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Show historical cashier acceptance source
        run: node backend/scripts/debug-retail-audit-cashier-source.mjs
