name: Grocery POS Generate Migration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grocery-pos-migration-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROCERY_DATABASE_URL: postgresql://migration_generator:migration_generator@127.0.0.1:5432/grocery_migration
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/grocery-total-rebuild
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Grocery dependencies
        working-directory: apps/grocery-pos
        run: npm install --no-audit --no-fund

      - name: Generate initial PostgreSQL migration
        working-directory: apps/grocery-pos
        run: |
          mkdir -p prisma/migrations/20260806010000_initial_grocery_foundation
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --output prisma/migrations/20260806010000_initial_grocery_foundation/migration.sql

      - name: Commit generated migration
        run: |
          if [ -z "$(git status --porcelain -- apps/grocery-pos/prisma/migrations)" ]; then
            echo "Migration is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/grocery-pos/prisma/migrations
          git commit -m "feat(grocery): regenerate initial database migration"
          git push origin HEAD:feat/grocery-total-rebuild
