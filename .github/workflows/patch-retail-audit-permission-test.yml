name: Patch Retail Audit Permission Test

on:
  push:
    branches: [ops/retail-live-audit-20260729]
    paths:
      - "backend/scripts/patch-retail-audit-permission-test.py"
      - ".github/workflows/patch-retail-audit-permission-test.yml"

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/retail-live-audit-20260729
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch and verify payload
        run: |
          python backend/scripts/patch-retail-audit-permission-test.py
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          root=Path('backend/scripts')
          parts=sorted(root.glob('qa-retail-live-audit.payload.*'),key=lambda p:int(p.name.rsplit('.',1)[1]))
          raw=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(raw).hexdigest() == '4adc5998e847f77f0521aa79057d6330aae1c82f6b17e478b18a790e8be738a0'
          Path('/tmp/qa-retail-live-audit.mjs').write_bytes(raw)
          PY
          node --check /tmp/qa-retail-live-audit.mjs
      - name: Commit verified runner only
        run: |
          rm backend/scripts/patch-retail-audit-permission-test.py
          rm .github/workflows/patch-retail-audit-permission-test.yml
          git config user.name "axtor-audit-bot"
          git config user.email "axtor-audit-bot@users.noreply.github.com"
          git add -A backend/scripts/qa-retail-live-audit.mjs \
                     backend/scripts/qa-retail-live-audit.payload.* \
                     backend/scripts/patch-retail-audit-permission-test.py \
                     .github/workflows/patch-retail-audit-permission-test.yml
          git commit -m "test(retail): verify unauthorized cashier payment policy"
          git push origin HEAD:ops/retail-live-audit-20260729
