name: Gym Live Production Certification

on:
  pull_request:
    branches: [backend]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/scripts/qa-gym-live-certification.mjs"
      - "backend/scripts/qa-gym-live-transform-runner.mjs"
      - ".github/workflows/gym-live-certification.yml"

permissions:
  contents: read

jobs:
  gym-live-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AXTOR_BACKEND_ORIGIN: https://axtor-cloud-pos-production.up.railway.app
      AXTOR_GYM_DEMO_PASSWORD: AxtorGymDemo@2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Seed and certify five live Gym businesses
        run: node backend/scripts/qa-gym-live-transform-runner.mjs
      - name: Upload Gym report and permanent demo credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-live-certification-${{ github.run_id }}
          path: |
            gym-live-certification-report.json
            gym-demo-credentials.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Gym launch readiness
        if: always()
        run: |
          test -s gym-live-certification-report.json
          node -e "const r=require('./gym-live-certification-report.json'); console.log('Gym certification:',r.overall,r.totals); if(r.overall!=='PASS') process.exit(1)"
