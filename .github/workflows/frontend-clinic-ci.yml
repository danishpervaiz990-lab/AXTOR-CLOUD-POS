name: Clinic Frontend CI

on:
  pull_request:
    branches: [frontend-clinic]
    paths:
      - "demo-static/clinic*.html"
      - "demo-static/css/clinic-app.css"
      - "demo-static/js/clinic-app.js"
      - "demo-static/js/axtor-api.js"
      - "tests/clinic-frontend.test.cjs"
      - ".github/workflows/frontend-clinic-ci.yml"
  push:
    branches: [frontend-clinic]
    paths:
      - "demo-static/clinic*.html"
      - "demo-static/css/clinic-app.css"
      - "demo-static/js/clinic-app.js"
      - "demo-static/js/axtor-api.js"
      - "tests/clinic-frontend.test.cjs"
      - ".github/workflows/frontend-clinic-ci.yml"

permissions:
  contents: read

jobs:
  static-release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: JavaScript syntax
        run: |
          node --check demo-static/js/axtor-api.js
          node --check demo-static/js/clinic-app.js
      - name: Clinic release suite
        run: node tests/clinic-frontend.test.cjs
