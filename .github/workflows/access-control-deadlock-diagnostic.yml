name: Access Control Deadlock Diagnostic

on:
  pull_request:
    branches: [backend]
    paths:
      - 'backend/src/services/system-roles.service.ts'
      - 'backend/src/controllers/access-control-v2.controller.ts'
      - 'backend/tests/access-control-r13.test.mjs'
      - 'backend/tests/access-control-system-role-concurrency.test.mjs'
      - 'backend/tests/access-control-deadlock-hardening.test.mjs'
      - '.github/workflows/access-control-deadlock-diagnostic.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - name: Run focused access-control tests
        run: node --test tests/access-control-r13.test.mjs tests/access-control-system-role-concurrency.test.mjs tests/access-control-deadlock-hardening.test.mjs
