name: Grocery Authenticated Live Bug Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/grocery-live-bug-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authenticated Grocery production bug audit
        env:
          FRONTEND: https://axtorpos.vercel.app/apps/grocery
          BACKEND: https://axtor-cloud-pos-production.up.railway.app
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const frontend = process.env.FRONTEND;
          const backend = process.env.BACKEND;
          const fatalBody = /LOCAL_GROCERY_DATABASE_DISABLED_USE_SHARED_BACKEND|Application not found|Internal Server Error|Cannot connect to the shared AXTOR backend|Cannot connect to the AXTOR backend|Route not found:/i;

          async function api(path,{method='GET',body,headers={},expected=[200]}={}) {
            const response = await fetch(backend + path, {
              method,
              cache:'no-store',
              headers:{Accept:'application/json',...(body!==undefined?{'Content-Type':'application/json'}:{}),...headers},
              body:body===undefined?undefined:JSON.stringify(body),
              signal:AbortSignal.timeout(20000),
            });
            const json = await response.json().catch(()=>null);
            if (!expected.includes(response.status)) throw new Error(`${method} ${path} HTTP ${response.status}: ${json?.error?.message||json?.message||json?.error||'failed'}`);
            return {status:response.status,data:json?.data??json};
          }

          function unique(items){return [...new Set(items)];}
          function relevantConsole(message){return !/favicon|ERR_ABORTED/i.test(message);}
          function relevantFailed(url){return !/favicon|robots\.txt/i.test(url);}

          (async()=>{
            const catalog=(await api('/api/v1/public/catalog')).data;
            const plans=Array.isArray(catalog?.plans)?catalog.plans:[];
            const plan=plans.find(p=>String(p.code||'').toLowerCase()==='professional')||plans.find(p=>p.isRecommended)||plans[0];
            if(!plan?.code) throw new Error('No active public plan available for live Grocery QA registration');

            const tag=`${Date.now()}-${crypto.randomBytes(3).toString('hex')}`;
            const email=`grocery.live.audit.${tag}@example.test`;
            const password=`GroceryLive!${crypto.randomBytes(18).toString('base64url')}9aA`;
            const registration=(await api('/api/v1/public/register',{
              method:'POST',
              expected:[200,201],
              headers:{'Idempotency-Key':`grocery-live-audit:${tag}`},
              body:{
                businessName:`Grocery Live Audit ${tag}`,
                ownerName:'Grocery Live Audit Owner',
                email,password,country:'QA',timezone:'Asia/Qatar',baseCurrency:'QAR',language:'en',
                industryCode:'grocery',planCode:String(plan.code).toLowerCase(),billingCycle:'MONTHLY',
                firstBranch:'Main Branch',firstWarehouse:'Main Warehouse',firstCounter:'Counter 1',
                taxSystem:'none',taxLabel:'Tax',invoicePrefix:'GRC',printProfile:'a4',pricesIncludeTax:false,
                sampleDataRequested:false,acceptTerms:true,acceptPrivacy:true,
              }
            })).data;
            const workspace=String(registration?.business?.slug||'').trim();
            if(!workspace) throw new Error('Registration returned no Grocery workspace slug');

            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:1000}});
            const page = await context.newPage();
            const pageErrors=[];
            const consoleErrors=[];
            const failedRequests=[];
            const badResponses=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error'&&relevantConsole(m.text()))consoleErrors.push(m.text());});
            page.on('requestfailed',r=>{if(relevantFailed(r.url()))failedRequests.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`);});
            page.on('response',r=>{if(r.status()>=500)badResponses.push(`${r.status()} ${r.url()}`);});

            const entry=await page.goto(frontend,{waitUntil:'domcontentloaded',timeout:60000});
            if(!entry||entry.status()!==200) throw new Error(`Grocery entry returned HTTP ${entry?.status()}`);
            await page.locator('input[name="workspace"]').waitFor({timeout:20000});
            await page.locator('input[name="workspace"]').fill(workspace);
            await page.locator('input[name="email"]').fill(email);
            await page.locator('input[name="password"]').fill(password);
            await page.getByRole('button',{name:'Sign in securely'}).click();
            await page.getByRole('heading',{name:'Grocery Dashboard'}).waitFor({timeout:30000});
            await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});

            const token=await page.evaluate(()=>localStorage.getItem('axtorAuthToken'));
            if(!token) throw new Error('Live Grocery UI login did not persist auth token');
            const auth={Authorization:`Bearer ${token}`};

            const apiChecks=[
              '/api/v1/auth/me',
              '/api/v1/industry/registry',
              '/api/v1/grocery/context',
              '/api/v1/dashboard/summary',
              '/api/v1/grocery/ageing?scope=customer',
              '/api/v1/grocery/ageing?scope=supplier',
              '/api/v1/grocery/expiry?window=30',
              '/api/v1/purchases?limit=50',
              '/api/v1/customers?limit=50',
              '/api/v1/suppliers?limit=50',
              '/api/v1/products?limit=50',
              '/api/v1/sales-documents?limit=50',
              '/api/v1/payments?limit=50',
              '/api/v1/accounts?active=true',
              '/api/v1/grocery/cheques'
            ];
            const apiResults=[];
            for(const path of apiChecks){
              const result=await api(path,{headers:auth,expected:[200]});
              apiResults.push({path,status:result.status});
            }
            const me=(await api('/api/v1/auth/me',{headers:auth})).data;
            const industry=String(me?.business?.industryCode||me?.business?.industry?.code||'').toLowerCase();
            if(industry!=='grocery') throw new Error(`Live QA tenant resolved as ${industry||'unknown'}, expected grocery`);

            let accounts=(await api('/api/v1/accounts?active=true',{headers:auth})).data;
            accounts=Array.isArray(accounts)?accounts:(Array.isArray(accounts?.accounts)?accounts.accounts:[]);
            let account=accounts.find(x=>x.active!==false)||accounts[0];
            if(!account?.id){
              account=(await api('/api/v1/accounts',{
                method:'POST',expected:[200,201],headers:{...auth,'Idempotency-Key':`grocery-live-account:${tag}`},
                body:{name:'Live QA Bank',type:'bank',bankName:'AXTOR Test Bank',currency:'QAR',openingBalance:0,active:true}
              })).data;
            }
            if(!account?.id) throw new Error('Could not resolve payment account for cheque live test');
            const now=new Date();
            const due=new Date(now.getTime()+7*86400000);
            const chequeNumber=`LIVE-QA-${tag}`;
            await api('/api/v1/grocery/cheques',{
              method:'POST',expected:[200,201],headers:{...auth,'Idempotency-Key':`grocery-live-cheque:${tag}`},
              body:{direction:'inward',paymentAccountId:account.id,chequeNumber,bankName:'AXTOR Test Bank',amount:125.50,currencyCode:'QAR',chequeDate:now.toISOString(),dueDate:due.toISOString(),notes:'Authenticated live Grocery bug audit'}
            });
            const reminders=(await api('/api/v1/grocery/cheques/reminders/generate',{method:'POST',expected:[200,201],headers:auth,body:{days:30}})).data;
            const chequeList=(await api('/api/v1/grocery/cheques',{headers:auth})).data;
            const cheques=Array.isArray(chequeList?.cheques)?chequeList.cheques:(Array.isArray(chequeList)?chequeList:[]);
            if(!cheques.some(c=>c.chequeNumber===chequeNumber)) throw new Error('Live-created cheque is missing from Grocery cheque API');
            if(Number(chequeList?.summary?.dueWithin30Days||0)<1) throw new Error('Cheque upcoming tally did not include live-created cheque');
            if(Number(reminders?.created||0)+Number(reminders?.unchanged||0)<1) throw new Error('Cheque reminder generation produced no evidence');

            await page.goto(`${frontend}?view=dashboard`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByRole('heading',{name:'Grocery Dashboard'}).waitFor({timeout:20000});
            const navViews=unique(await page.$$eval('[data-nav]',els=>els.map(el=>el.dataset.nav).filter(Boolean)));
            if(navViews.length<10) throw new Error(`Only ${navViews.length} Grocery navigation views discovered`);
            const viewResults=[];
            for(const view of navViews){
              await page.goto(`${frontend}?view=${encodeURIComponent(view)}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(700);
              await page.waitForLoadState('networkidle',{timeout:10000}).catch(()=>{});
              const body=await page.locator('body').innerText();
              const notice=await page.locator('.notice-error').allInnerTexts();
              const heading=await page.locator('h1').first().innerText().catch(()=> '');
              if(fatalBody.test(body)) throw new Error(`${view}: fatal runtime message detected`);
              if(notice.length) throw new Error(`${view}: visible error notice: ${notice.join(' | ')}`);
              if(!heading.trim()) throw new Error(`${view}: no page heading rendered`);
              viewResults.push({view,heading});
            }

            // Mobile/narrow-laptop drawer behavior using the actual production controls.
            await page.setViewportSize({width:412,height:915});
            await page.goto(`${frontend}?view=dashboard`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByRole('heading',{name:'Grocery Dashboard'}).waitFor({timeout:20000});
            await page.locator('#mobile-menu').click();
            await page.locator('#side-nav.open').waitFor({timeout:5000});
            await page.locator('.grocery-nav-backdrop.open').click({position:{x:5,y:5}});
            await page.waitForFunction(()=>!document.querySelector('#side-nav')?.classList.contains('open'));
            await page.locator('#mobile-menu').click();
            await page.locator('.grocery-nav-close').click();
            await page.waitForFunction(()=>!document.querySelector('#side-nav')?.classList.contains('open'));
            await page.locator('#mobile-menu').click();
            const firstNav=page.locator('#side-nav [data-nav]').first();
            await firstNav.click();
            await page.waitForFunction(()=>!document.querySelector('#side-nav')?.classList.contains('open'));

            await page.goto(`${frontend}?view=cheques`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(800);
            const chequeBody=await page.locator('body').innerText();
            if(!chequeBody.includes(chequeNumber)) throw new Error('Cheques UI does not display live-created cheque');

            const dedupe=arr=>unique(arr.map(String));
            const finalErrors={
              pageErrors:dedupe(pageErrors),
              consoleErrors:dedupe(consoleErrors),
              failedRequests:dedupe(failedRequests),
              badResponses:dedupe(badResponses),
            };
            const errorCount=Object.values(finalErrors).reduce((n,a)=>n+a.length,0);
            const report={
              generatedAt:new Date().toISOString(),
              production:{frontend,backend,workspace},
              authenticated:true,
              industry,
              apiResults,
              navigationViews:viewResults,
              mobileDrawer:'PASS',
              liveCheque:{displayed:true,upcoming:true,reminder:true},
              errors:finalErrors,
              overall:errorCount===0?'PASS':'FAIL'
            };
            fs.writeFileSync('grocery-live-bug-audit-report.json',JSON.stringify(report,null,2));
            await page.screenshot({path:'grocery-live-bug-audit.png',fullPage:true});
            await context.close();
            await browser.close();
            console.log(JSON.stringify({overall:report.overall,apiChecks:apiResults.length,views:viewResults.length,errorCount,mobileDrawer:report.mobileDrawer,liveCheque:report.liveCheque},null,2));
            if(errorCount) throw new Error(`Live Grocery audit found ${errorCount} browser/network/runtime error(s)`);
          })().catch(error=>{
            console.error(error.stack||error);
            process.exit(1);
          });
          NODE
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grocery-authenticated-live-bug-audit-${{ github.run_id }}
          path: |
            grocery-live-bug-audit-report.json
            grocery-live-bug-audit.png
          if-no-files-found: warn
          retention-days: 14
