name: Hardware Live Production Audit

on:
  pull_request:
    branches: [backend]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/scripts/qa-hardware-live-audit.mjs"
      - "backend/scripts/qa-hardware-transaction-gate.mjs"
      - "backend/scripts/qa-hardware-payment-finalizer.mjs"
      - "backend/scripts/qa-hardware-operations-audit.mjs"
      - "backend/scripts/qa-hardware-branding-audit.mjs"
      - "backend/scripts/qa-hardware-browser-audit.mjs"
      - "backend/scripts/qa-retail-live-audit.payload.*"
      - "backend/scripts/retail-audit-recipient-cert.pem"
      - ".github/workflows/hardware-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AXTOR_PUBLIC_ORIGIN: https://axtorpos.vercel.app
      AXTOR_BACKEND_ORIGIN: https://axtor-cloud-pos-production.up.railway.app
      AXTOR_AUDIT_INDUSTRY: hardware
      AXTOR_AUDIT_PRODUCT_COUNT: "100"
      AXTOR_AUDIT_CUSTOMER_COUNT: "200"
      AXTOR_AUDIT_INVOICE_COUNT: "500"
      AXTOR_AUDIT_CASH_CREDIT_MIX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Run Hardware transaction and reports audit
        id: transaction_audit
        continue-on-error: true
        run: node backend/scripts/qa-hardware-live-audit.mjs

      - name: Enforce stored Hardware transaction evidence
        id: transaction_gate
        if: always()
        continue-on-error: true
        run: node backend/scripts/qa-hardware-transaction-gate.mjs

      - name: Settle any remaining audited credit balance
        id: payment_finalizer
        if: always() && steps.transaction_gate.outcome == 'success'
        continue-on-error: true
        run: node backend/scripts/qa-hardware-payment-finalizer.mjs

      - name: Run branches, staffing, expenses, supplier and percentage reports audit
        id: operations_audit
        if: always() && steps.transaction_gate.outcome == 'success' && steps.payment_finalizer.outcome == 'success'
        continue-on-error: true
        run: node backend/scripts/qa-hardware-operations-audit.mjs

      - name: Register dummy company and persist invoice logo
        id: branding_audit
        if: always() && steps.operations_audit.outcome == 'success'
        continue-on-error: true
        run: node backend/scripts/qa-hardware-branding-audit.mjs

      - name: Install browser runtime
        if: always() && steps.branding_audit.outcome == 'success'
        run: |
          test -f hardware-live-audit-runtime.json
          mkdir -p /tmp/axtor-playwright
          npm init -y --prefix /tmp/axtor-playwright >/dev/null
          npm install --prefix /tmp/axtor-playwright playwright@1.55.0 --no-audit --no-fund
          /tmp/axtor-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Test five users, settings and Hardware pages through Vercel
        id: browser_audit
        if: always() && steps.branding_audit.outcome == 'success'
        continue-on-error: true
        run: node backend/scripts/qa-hardware-browser-audit.mjs

      - name: Protect and remove Hardware credentials
        if: always()
        run: |
          if [ -f hardware-live-audit-credentials.json ]; then
            if [ -s backend/scripts/retail-audit-recipient-cert.pem ]; then
              openssl cms -encrypt -binary -aes-256-cbc \
                -in hardware-live-audit-credentials.json \
                -out hardware-live-audit-credentials.p7m \
                -outform DER \
                backend/scripts/retail-audit-recipient-cert.pem
              test -s hardware-live-audit-credentials.p7m
            else
              sha256sum hardware-live-audit-credentials.json | cut -d' ' -f1 > hardware-live-audit-credentials.sha256
            fi
            shred -u hardware-live-audit-credentials.json
          fi
          if [ -f hardware-live-audit-runtime.json ]; then shred -u hardware-live-audit-runtime.json; fi
          if [ -f .hardware-live-audit.generated.mjs ]; then shred -u .hardware-live-audit.generated.mjs; fi

      - name: Upload protected Hardware audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-live-audit-${{ github.run_id }}
          path: |
            hardware-live-audit-report.json
            hardware-live-audit-credentials.p7m
            hardware-live-audit-credentials.sha256
            hardware-live-audit-cleanup.sql
            hardware-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Hardware launch-readiness result
        if: always()
        env:
          TRANSACTION_OUTCOME: ${{ steps.transaction_gate.outcome }}
          PAYMENT_OUTCOME: ${{ steps.payment_finalizer.outcome }}
          OPERATIONS_OUTCOME: ${{ steps.operations_audit.outcome }}
          BRANDING_OUTCOME: ${{ steps.branding_audit.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_audit.outcome }}
        run: |
          test "$TRANSACTION_OUTCOME" = "success"
          test "$PAYMENT_OUTCOME" = "success"
          test "$OPERATIONS_OUTCOME" = "success"
          test "$BRANDING_OUTCOME" = "success"
          test "$BROWSER_OUTCOME" = "success"
          test -s hardware-live-audit-report.json
          node -e "const r=require('./hardware-live-audit-report.json'); console.log('Hardware audit result:',r.overall); if(r.overall!=='PASS') process.exit(1)"
