name: Grocery Frontend CI
on:
  pull_request:
    branches: [frontend-grocery]
  push:
    branches: [frontend-grocery, frontend-grocery-readiness-work, work/grocery-wp2-document-routing]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check demo-static/js/axtor-api.js
      - run: node --check demo-static/js/grocery-app.js
      - run: node --check demo-static/js/grocery-tenant-locale.js
      - run: node --check demo-static/js/grocery-report-sync.js
      - run: node --check demo-static/js/grocery-sales-analytics.js
      - run: node --check demo-static/js/grocery-operational-postgres.js
      - run: node --check demo-static/js/grocery-finance-reports.js
      - run: node --check demo-static/js/grocery-dashboard-postgres.js
      - run: node --check demo-static/js/grocery-production-readiness.js
      - run: node --check demo-static/js/grocery-operations-pack.js
      - run: node --check demo-static/js/grocery-print-settings-backend.js
      - run: node --check demo-static/js/grocery-document-routing.js
      - run: node --check demo-static/js/grocery-invoice-print-reconciliation.js
      - run: node --check demo-static/js/grocery-terminal-reconciliation.js
      - run: node --check demo-static/js/grocery-customer-payments.js
      - run: node --check demo-static/js/returns-backend.js
      - run: node --check demo-static/js/grocery-returns-reconciliation.js
      - run: node --check demo-static/js/grocery-purchase-receiving.js
      - run: node --check demo-static/js/grocery-inventory-integrity.js
      - run: node --check demo-static/js/grocery-transaction-guard.js
      - run: node tests/grocery-frontend.test.cjs
      - run: node tests/grocery-reports-postgres.test.cjs
      - run: node tests/grocery-finance-reports.test.cjs
      - run: node tests/grocery-dashboard-postgres.test.cjs
      - run: node tests/grocery-invoice-print.test.cjs
      - run: node tests/grocery-terminal-reconciliation.test.cjs
      - run: node tests/grocery-customer-payments.test.cjs
      - run: node tests/grocery-returns-refunds.test.cjs
      - run: node tests/grocery-purchase-receiving.test.cjs
      - run: node tests/grocery-inventory-integrity.test.cjs
      - run: node tests/grocery-locale-currency.test.cjs
      - run: node tests/grocery-locale-coverage.test.cjs
      - run: |
          if grep -R "industry.html?module=" demo-static/grocery-*.html; then exit 1; fi
      - run: |
          if grep -R -E "Demo business|Demo owner|Sample Product|Customer Ready Mode" demo-static/grocery-*.html; then exit 1; fi
      - run: node -e "JSON.parse(require('fs').readFileSync('demo-static/vercel.json','utf8')); console.log('Vercel configuration valid')"
