name: Cross-Industry Release Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "deployment/**"
      - "scripts/certify-release-branches.mjs"
      - ".github/workflows/release-certification.yml"
      - ".github/workflows/main-saas-router-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - name: Certify released branches and secure router
        run: node scripts/certify-release-branches.mjs
