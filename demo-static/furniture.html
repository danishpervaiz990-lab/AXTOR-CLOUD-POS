<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Furniture</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#07140f;color:#eefaf2}.side{width:250px;position:fixed;inset:0 auto 0 0;background:#0b2118;padding:22px}.side a{display:block;color:#b8d9c6;padding:9px;text-decoration:none}.main{margin-left:250px;padding:25px}.glass{background:#123426;border:1px solid #285c45;border-radius:18px;padding:18px}.kpi{font-size:28px;font-weight:700}.form-control{background:#102c21;color:white;border-color:#2d694e}.table{color:#eefaf2}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}}</style></head><body><aside class="side"><h3>AXTOR</h3><p>Furniture Studio</p><a href="furniture.html"><i class="bi bi-house-door"></i> Dashboard</a><a href="#orders">Custom Orders</a><a href="#production">Production</a><a href="#delivery">Delivery & Installation</a><a href="#warranty">Warranty</a><a href="furniture-operations.html">Operations & Warranty</a><a href="login.html">Sign out</a></aside><main class="main"><h1>Furniture Dashboard</h1><div class="row g-3 my-3"><div class="col-md-3"><div class="glass">Open Orders<div class="kpi" data-k="openOrders">0</div></div></div><div class="col-md-3"><div class="glass">In Production<div class="kpi" data-k="inProduction">0</div></div></div><div class="col-md-3"><div class="glass">Deliveries<div class="kpi" data-k="scheduledDeliveries">0</div></div></div><div class="col-md-3"><div class="glass">Outstanding<div class="kpi" data-k="outstandingBalance">0</div></div></div></div><div class="glass" id="orders"><h4>Custom-order queue</h4><div class="table-responsive"><table class="table"><thead><tr><th>Order</th><th>Description</th><th>Status</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="js/axtor-api.js?v=20260726-repair1"></script><script>const B=window.AxtorAPI.getApiBaseUrl();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(B+'/api/v1/'+p,{headers:{Authorization:'Bearer '+(localStorage.getItem('axtorAuthToken')||'')}});const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data}async function load(){const d=await api('furniture/dashboard');Object.keys(d).forEach(k=>{const e=document.querySelector('[data-k="'+k+'"]');if(e)e.textContent=d[k]});const rows=await api('furniture/orders');document.querySelector('#rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.orderNo)}</td><td>${esc(x.description)}</td><td>${esc(x.status)}</td><td>${Number(x.balance).toFixed(2)}</td></tr>`).join('')}load().catch(e=>alert(e.message));</script></body></html>
