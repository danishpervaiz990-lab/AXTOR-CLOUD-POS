<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Restaurant & Café</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#07140f;color:#eaf8f0;font-family:system-ui}.side{width:250px;position:fixed;inset:0 auto 0 0;background:#0b2118;padding:22px}.side a{display:block;color:#b8d9c6;padding:10px;border-radius:10px;text-decoration:none}.side a:hover,.side a.active{background:#174f39;color:white}.main{margin-left:250px;padding:25px}.glass{background:rgba(20,64,47,.72);border:1px solid rgba(151,230,188,.18);border-radius:18px;padding:18px}.kpi{font-size:28px;font-weight:700}.table{color:#eaf8f0}.form-control,.form-select{background:#102c21;color:white;border-color:#2d694e}.btn-brand{background:#36c77a;color:#042015}@media(max-width:800px){.side{position:static;width:auto}.main{margin-left:0}}</style></head><body><aside class="side"><h3>AXTOR</h3><p>Restaurant & Café</p><a href="#"><i class="bi bi-cup-hot"></i> Floor & Tables</a><a href="#"><i class="bi bi-cup-hot"></i> Menu</a><a href="#"><i class="bi bi-cup-hot"></i> Kitchen Display</a><a href="#"><i class="bi bi-cup-hot"></i> Orders</a><a href="#"><i class="bi bi-cup-hot"></i> Reservations</a><a href="#"><i class="bi bi-cup-hot"></i> Recipes</a><a href="#"><i class="bi bi-cup-hot"></i> Wastage</a><a href="#"><i class="bi bi-cup-hot"></i> Reports</a><a href="restaurant-operations.html">Operations</a><a href="login.html">Sign out</a></aside><main class="main"><h1>Restaurant & Café Dashboard</h1><div class="row g-3 my-3"><div class="col-md-3"><div class="glass"><div>Tables</div><div class="kpi" data-k="tables">0</div></div></div><div class="col-md-3"><div class="glass"><div>Open Orders</div><div class="kpi" data-k="openOrders">0</div></div></div><div class="col-md-3"><div class="glass"><div>Kitchen Queue</div><div class="kpi" data-k="kitchenQueue">0</div></div></div></div><div class="row g-3"><div class="col-lg-4"><div class="glass"><h4>Quick action</h4><form id="create" class="d-grid gap-2"><input class="form-control" name="tableNo" placeholder="Table number" required><input class="form-control" name="capacity" type="number" value="2" min="1"><button class="btn btn-brand">Add table</button></form></div></div><div class="col-lg-8"><div class="glass"><h4>Operational queue</h4><div class="table-responsive"><table class="table"><thead><tr><th>Table</th><th>Capacity</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></main><script>const API=(window.AXTOR_API_BASE||localStorage.getItem('axtorApiBase')||'').replace(/\/$/,'');const token=()=>localStorage.getItem('axtorAuthToken')||'';async function api(path,opt={}){const r=await fetch(API+'/api/v1/'+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.error?.message||'Request failed');return j.data}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await api('restaurant/dashboard');['tables','openOrders','kitchenQueue'].forEach(k=>document.querySelector('[data-k="'+k+'"]').textContent=d[k]||0);const ts=await api('restaurant/tables');document.querySelector('#rows').innerHTML=ts.map(x=>`<tr><td>${esc(x.tableNo)}</td><td>${x.capacity}</td><td>${esc(x.status)}</td></tr>`).join('')}document.querySelector('#create').onsubmit=async e=>{e.preventDefault();await api('restaurant/tables',{method:'POST',body:JSON.stringify({tableNo:e.target.tableNo.value,capacity:e.target.capacity.value})});e.target.reset();load()};load().catch(e=>alert(e.message));</script></body></html>
