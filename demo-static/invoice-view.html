<!doctype html>
<html data-theme="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
  (function () {
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('axtorTheme') || 'light'); }
    catch (_) { document.documentElement.setAttribute('data-theme', 'light'); }
    const url = new URL(location.href);
    const raw = String(url.searchParams.get('profile') || '').toLowerCase();
    const aliases = { thermal80: 'thermal-80', '80mm': 'thermal-80', thermal58: 'thermal-58', '58mm': 'thermal-58', a4: 'a4' };
    if (aliases[raw] && aliases[raw] !== raw) {
      url.searchParams.set('profile', aliases[raw]);
      history.replaceState(null, '', url);
    }
  })();
  </script>
  <title>Grocery Document View · Axtor POS Cloud</title>
  <link href="assets/images/logo.svg" rel="icon" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css?v=20260804-grocery-document1" rel="stylesheet">
  <link href="css/retro-pos-theme.css?v=20260804-grocery-document1" rel="stylesheet">
  <meta name="theme-color" content="#0f9f78">
</head>
<body data-industry="grocery" data-page="invoice-view">
  <main class="page" style="max-width:1120px;margin:auto">
    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3 no-print">
      <div>
        <h2 class="fw-bold mb-1">Grocery Document View</h2>
        <p class="text-muted mb-0">Print-ready invoice, return, refund or receipt with batch and expiry context.</p>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-soft" href="grocery-dashboard.html"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <button class="btn btn-brand" id="invoiceViewPrintBtn" type="button"><i class="bi bi-printer"></i> Print</button>
      </div>
    </div>
    <div class="alert alert-info no-print d-none" id="invoiceViewStatus" role="status"></div>
    <div id="invoiceViewRoot"><div class="cardx text-center text-muted py-5"><span class="spinner-border spinner-border-sm me-2"></span>Loading saved Grocery document…</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/axtor-api.js?v=20260804-grocery-document1"></script>
  <script src="js/grocery-tenant-locale.js?v=20260804-grocery-document1"></script>
  <script src="js/invoice-templates.js?v=20260804-grocery-document1"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const root = document.getElementById('invoiceViewRoot');
    const status = document.getElementById('invoiceViewStatus');
    const query = new URLSearchParams(location.search);
    function decodePayload() {
      const raw = query.get('data');
      if (!raw) return null;
      try { return JSON.parse(decodeURIComponent(escape(atob(raw)))); }
      catch (_) { return null; }
    }
    const payload = decodePayload();
    const backendDocument = query.get('id') || query.get('documentNo') || query.get('no');
    if (payload) {
      const template = payload.template || (window.AxtorInvoice && AxtorInvoice.selectedTemplate()) || 'modern-a4';
      const data = Object.assign({}, payload);
      delete data.template;
      root.innerHTML = window.AxtorInvoice
        ? AxtorInvoice.render(template, { data })
        : '<div class="alert alert-danger">Invoice engine not loaded.</div>';
      return;
    }
    if (!backendDocument) {
      root.innerHTML = '';
      status.className = 'alert alert-warning no-print';
      status.textContent = 'No saved document was selected. Return to Sales and open View / Print again.';
      status.classList.remove('d-none');
    }
  });
  </script>
  <script src="js/backend-page-utils.js?v=20260804-grocery-document1"></script>
  <script src="js/invoice-view-backend.js?v=20260804-grocery-document1"></script>
  <script src="js/grocery-invoice-print-reconciliation.js?v=20260804-grocery-document1"></script>
</body>
</html>
