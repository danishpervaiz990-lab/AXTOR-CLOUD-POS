<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Session Handoff</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07130f;color:#eefbf5;font-family:Inter,system-ui,sans-serif}.card{width:min(560px,calc(100% - 28px));padding:28px;border-radius:16px;background:#0e241c;border:1px solid #285342}p{color:#a6c9b8}.error{color:#fca5a5}</style></head><body><main class="card"><h1>Establishing your Axtor session</h1><p id="status">Exchanging the one-time session code…</p></main><script>(async()=>{const API='https://axtor-cloud-pos-production.up.railway.app';const p=new URLSearchParams(location.search);const code=String(p.get('code')||'').trim();const requested=String(p.get('return')||'').trim();const safe=v=>!v||/^https?:\/\//i.test(v)||v.startsWith('//')||v.includes('..')?'index.html':v.replace(/^\/+/,'');try{if(!code)throw Error('The one-time handoff code is missing.');const r=await fetch(API+'/api/v1/auth/exchange',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({code,targetOrigin:location.origin}),cache:'no-store'});const data=await r.json().catch(()=>null);history.replaceState(null,'',location.pathname);if(!r.ok||!data?.token)throw Error(data?.error?.message||'Session handoff failed.');localStorage.setItem('axtorAuthToken',data.token);localStorage.setItem('axtorTokenType',data.tokenType||'Bearer');localStorage.setItem('axtorTokenExpiresIn',String(data.expiresIn||''));localStorage.setItem('axtorBusiness',JSON.stringify(data.business||{}));localStorage.setItem('currentUser',JSON.stringify(data.user||{}));localStorage.setItem('axtorCurrentUser',JSON.stringify(data.user||{}));localStorage.setItem('axtorPermissions',JSON.stringify(data.permissions||[]));document.getElementById('status').textContent='Session established. Opening your workspace…';setTimeout(()=>location.replace(safe(requested)),250);}catch(e){const el=document.getElementById('status');el.textContent=e.message||'Session handoff failed.';el.className='error';}})();</script></body></html>
