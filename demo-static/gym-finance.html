<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Dues, Renewals & Reports</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/release-b-final.css?v=20260727" rel="stylesheet"></head><body><div class="shell"><aside class="navx"><h4>AXTOR · Gym</h4><a href="gym.html">Dashboard</a><a class="active" href="#">Finance & Control</a><a href="settings.html">Settings</a></aside><main class="main"><section class="hero"><h1>Gym Dues, Renewals & Reports</h1><p>Permission-controlled posting, idempotent payments, filtered reports and print-ready summaries.</p><div class="row g-2 no-print"><div class="col"><input id="from" type="date" class="form-control"></div><div class="col"><input id="to" type="date" class="form-control"></div><div class="col-auto"><button id="printPage" class="btn btn-outline-light">Print</button></div></div></section><div class="grid"><section class="cardx"><h2 class="h5">Membership payment</h2><form data-endpoint="/api/v1/gym/membership-payments" data-method="POST" data-idempotent="1" ><div class="mb-2"><label class="form-label">Membership ID</label><input class="form-control" name="membershipId" type="text" required></div><div class="mb-2"><label class="form-label">Amount</label><input class="form-control" name="amount" type="number" required></div><div class="mb-2"><label class="form-label">Payment method</label><input class="form-control" name="paymentMethod" type="text" required></div><div class="mb-2"><label class="form-label">Reference</label><input class="form-control" name="reference" type="text" ></div><button class="btn btn-success">Save</button><pre class="result mt-2">Ready.</pre></form></section><section class="cardx"><h2 class="h5">Renew membership</h2><form data-endpoint="/api/v1/gym/membership-renewals" data-method="POST"  ><div class="mb-2"><label class="form-label">Membership ID</label><input class="form-control" name="membershipId" type="text" required></div><div class="mb-2"><label class="form-label">New plan ID</label><input class="form-control" name="planId" type="text" ></div><div class="mb-2"><label class="form-label">Amount</label><input class="form-control" name="amount" type="number" ></div><button class="btn btn-success">Save</button><pre class="result mt-2">Ready.</pre></form></section><section class="cardx"><h2 class="h5">Notification rule</h2><form data-endpoint="/api/v1/gym/notification-rules" data-method="PUT"  ><div class="mb-2"><label class="form-label">Event key</label><input class="form-control" name="eventKey" type="text" required></div><div class="mb-2"><label class="form-label">Days before</label><input class="form-control" name="daysBefore" type="number" required></div><div class="mb-2"><label class="form-label">Channel</label><input class="form-control" name="channel" type="text" required></div><button class="btn btn-success">Save</button><pre class="result mt-2">Ready.</pre></form></section><section class="cardx"><h2 class="h5">Filtered report</h2><button class="btn btn-info no-print" data-report data-endpoint="/api/v1/gym/reports/filtered" data-target="#reportOut">Load report</button><pre id="reportOut" class="result report mt-2">Choose dates and load.</pre></section></div></main></div><script src="js/axtor-api.js?v=20260727"></script><script src="js/release-b-final.js?v=20260727"></script></body></html>
