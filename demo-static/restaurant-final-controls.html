<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Final Controls</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap.3.3/dist/css/bootstrap.min.css"><style>body{background:#071b16;color:#eef;padding:24px}.panel{background:rgba(20,80,60,.35);border:1px solid #3a8;padding:20px;border-radius:18px}button{margin:6px;padding:12px}@media print{button,.no-print{display:none}body{background:#fff;color:#000;padding:0}.label58{width:58mm}.label80{width:80mm}}</style></head><body><div class="panel"><h1>Restaurant Final Controls</h1><p>Tenant-authenticated operational control surface. Enter record ID and required values, then use the relevant action.</p><input id="recordId" class="form-control" placeholder="Record ID"><input id="value" class="form-control mt-2" placeholder="Value / target ID / amount"><div><button data-action="course">Hold / Fire Course</button><button data-action="move">Move Table</button><button data-action="bill">Apply Tip / Discount</button><button data-action="reverse">Reverse Wastage</button></div><pre id="result"></pre></div><script src="js/axtor-api.js"></script><script>document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('result').textContent='Use the dedicated operational form connected to /api/v1/restaurant/...';}));</script></body></html>
