<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Wholesale Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#10130b;color:#f8faee}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#29321b;color:#f8faee;border:1px solid #607543}.form-control{background:#1b2412;color:white;border-color:#607543}@media print{nav,.no-print{display:none!important}body{background:white;color:black}.card{background:white;color:black}}</style></head><body><nav class="p-3"><a class="btn btn-outline-light" href="wholesale.html">Dashboard</a></nav><main class="wrap"><h1>Wholesale Packing, Routes & Collections</h1><div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h4>Assign Price List</h4><form data-endpoint="/api/v1/wholesale/price-list-assignments"><input class="form-control mb-2" name="customerId" placeholder="Customer ID" required><input class="form-control mb-2" name="priceListId" placeholder="Price-list ID" required><button class="btn btn-warning">Assign</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Create Packing List</h4><form data-endpoint="/api/v1/wholesale/packing-lists"><input class="form-control mb-2" name="pickListId" placeholder="Pick-list ID" required><input class="form-control mb-2" name="packedBy" placeholder="Packed by"><button class="btn btn-warning">Pack</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Record Collection</h4><form data-endpoint="/api/v1/wholesale/collections"><input class="form-control mb-2" name="salesOrderId" placeholder="Sales-order ID" required><input class="form-control mb-2" name="amount" type="number" step="0.01" required><select class="form-control mb-2" name="method"><option>bank</option><option>cash</option><option>card</option></select><button class="btn btn-warning">Post collection</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Distribution Report</h4><button class="btn btn-warning" data-load="/api/v1/wholesale/reports">Load report</button><button class="btn btn-outline-light no-print" onclick="print()">Print dispatch report</button><pre id="report" class="mt-2"></pre></div></div></div></main><script src="js/axtor-api.js"></script><script src="js/release-d-remaining.js"></script></body></html>
