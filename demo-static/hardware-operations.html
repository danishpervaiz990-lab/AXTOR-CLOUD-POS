<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Hardware Trade Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#101512;color:#f5faf7}.wrap{max-width:1200px;margin:auto;padding:24px}.glass{background:#19241e;border:1px solid #42604f;border-radius:18px;padding:18px}.form-control{background:#111b16;color:#fff;border-color:#42604f}.table{color:#fff}@media print{.no-print{display:none!important}body{background:#fff;color:#000}.glass{border:0;color:#000}.table{color:#000}}</style></head><body><div class="wrap"><div class="d-flex justify-content-between"><div><h1>Hardware Trade Operations</h1><p>Quotations, LPO, delivery, warranty and trade reporting</p></div><div class="no-print"><a class="btn btn-outline-light" href="hardware.html">Dashboard</a> <button class="btn btn-success" onclick="print()">Print</button></div></div><div class="row g-3"><div class="col-lg-5"><div class="glass no-print"><h4>Quick quotation</h4><form id="quote" class="d-grid gap-2"><input class="form-control" name="customerId" placeholder="Customer ID" required><input class="form-control" name="projectId" placeholder="Project ID"><input class="form-control" name="lpoNo" placeholder="Customer LPO"><input class="form-control" name="productId" placeholder="Product ID" required><input class="form-control" name="description" placeholder="Description" required><input class="form-control" name="quantity" type="number" step="0.001" min="0.001" required><input class="form-control" name="unit" value="piece"><input class="form-control" name="cutLength" type="number" step="0.001" placeholder="Cut length"><input class="form-control" name="unitPrice" type="number" step="0.01" min="0" required><button class="btn btn-success">Create quotation</button></form></div></div><div class="col-lg-7"><div class="glass"><h4>Recent quotations</h4><table class="table"><thead><tr><th>No.</th><th>LPO</th><th>Total</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><h4>Trade summary</h4><pre id="report"></pre></div></div></div></div><script src="js/axtor-api.js"></script><script>const api=async(p,o={})=>{const r=await fetch(window.AxtorAPI.getApiBaseUrl()+'/api/v1/'+p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('axtorAuthToken'),...(o.headers||{})}}),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [qs,rp]=await Promise.all([api('hardware/quotations'),api('hardware/reports')]);rows.innerHTML=qs.map(x=>`<tr><td>${esc(x.quotationNo)}</td><td>${esc(x.lpoNo||'-')}</td><td>${Number(x.total).toFixed(2)}</td><td>${esc(x.status)}</td></tr>`).join('');report.textContent=JSON.stringify(rp,null,2)}quote.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));const item={productId:x.productId,description:x.description,quantity:x.quantity,unit:x.unit,cutLength:x.cutLength||null,unitPrice:x.unitPrice};await api('hardware/quotations',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({customerId:x.customerId,projectId:x.projectId||null,lpoNo:x.lpoNo||null,items:[item]})});e.target.reset();load()};load().catch(e=>alert(e.message));</script></body></html>
