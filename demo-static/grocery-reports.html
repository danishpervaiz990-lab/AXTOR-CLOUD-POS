<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AXTOR Grocery Reports</title>
  <style>
    :root{--bg:#07130f;--panel:#0d211a;--line:#24543f;--text:#eefaf4;--muted:#9bc2ae;--accent:#44d98f;--danger:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06100d,#10271d);color:var(--text);font:14px/1.45 Arial,sans-serif}.shell{max-width:1500px;margin:auto;padding:24px}.hero,.panel,.summary{background:rgba(13,33,26,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 45px rgba(0,0,0,.24)}.hero{padding:22px;margin-bottom:18px;display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--accent)}.panel{padding:18px;margin-bottom:18px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;color:var(--muted);margin-bottom:6px}select,input,button{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#081711;color:var(--text)}button{cursor:pointer;background:var(--accent);color:#042014;font-weight:700}.actions{display:flex;gap:10px}.actions button{width:auto}.secondary{background:#0b1c16;color:var(--text)}.status{margin-top:12px;color:var(--muted)}.status.ok{color:var(--accent)}.status.error{color:var(--danger)}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.summary{padding:16px}.summary span{display:block;color:var(--muted);font-size:12px}.summary strong{display:block;margin-top:6px;font-size:22px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 12px;border-bottom:1px solid rgba(36,84,63,.65);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#102a20;color:#c9f7df}.percent{color:var(--accent);font-weight:700}.head-row{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.head-row h2{margin:0}.muted{color:var(--muted)}@media(max-width:800px){.controls{grid-template-columns:1fr}.hero{display:block}.badge{display:inline-block;margin-top:12px}.actions{flex-wrap:wrap}}@media print{body{background:white;color:#111}.shell{max-width:none;padding:0}.hero,.panel,.summary{box-shadow:none;border-color:#aaa;background:white}.controls,.actions,.status,.badge{display:none}.muted,label{color:#555}th{background:#eee;color:#111}.percent{color:#111}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><div><h1>AXTOR Grocery Analytics</h1><p>PostgreSQL-backed sales, payment, cashier and terminal reports.</p></div><div id="tenantBadge" class="badge">Checking Grocery tenant…</div></section>
    <section class="panel">
      <div class="controls">
        <div><label for="reportSelect">Report</label><select id="reportSelect"></select></div>
        <div><label for="dateFrom">From</label><input id="dateFrom" type="date"></div>
        <div><label for="dateTo">To</label><input id="dateTo" type="date"></div>
        <div><button id="runReport" type="button">Run Report</button></div>
      </div>
      <div class="actions" style="margin-top:12px"><button id="exportCsv" class="secondary" type="button">Export CSV</button><button id="printReport" class="secondary" type="button">Print</button></div>
      <div id="status" class="status"></div>
    </section>
    <section id="summaryGrid" class="summary-grid"></section>
    <section class="panel">
      <div class="head-row"><div><h2 id="reportTitle">Grocery Report</h2><div id="reportBasis" class="muted"></div></div><strong id="rowCount"></strong></div>
      <div class="table-wrap"><table><thead id="reportHead"></thead><tbody id="reportBody"><tr><td>Loading…</td></tr></tbody></table></div>
    </section>
  </main>
  <script src="js/axtor-api.js?v=20260802-grocery-production1"></script>
  <script src="js/grocery-reports-production.js?v=20260802-grocery-production1"></script>
</body>
</html>
