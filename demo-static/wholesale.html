<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Wholesale</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#07140f;color:#eefaf2}.side{width:250px;position:fixed;inset:0 auto 0 0;background:#0b2118;padding:22px}.side a{display:block;color:#b8d9c6;padding:9px;text-decoration:none}.main{margin-left:250px;padding:25px}.glass{background:#123426;border:1px solid #285c45;border-radius:18px;padding:18px}.kpi{font-size:28px;font-weight:700}.table{color:#eefaf2}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}}</style></head><body><aside class="side"><h3>AXTOR</h3><p>Wholesale Distribution</p><a href="wholesale.html">Dashboard</a><a href="#orders">Sales Orders</a><a href="#prices">Price Lists</a><a href="#picking">Picking</a><a href="#dispatch">Dispatch</a><a href="#backorders">Backorders</a><a href="wholesale-operations.html">Packing, Routes & Collections</a><a href="login.html">Sign out</a></aside><main class="main"><h1>Wholesale Dashboard</h1><div class="row g-3 my-3"><div class="col-md-3"><div class="glass">Open Orders<div class="kpi" data-k="openOrders">0</div></div></div><div class="col-md-3"><div class="glass">Pick Lists<div class="kpi" data-k="openPickLists">0</div></div></div><div class="col-md-3"><div class="glass">Dispatches<div class="kpi" data-k="activeDispatches">0</div></div></div><div class="col-md-3"><div class="glass">Backorders<div class="kpi" data-k="backorders">0</div></div></div></div><div class="glass" id="orders"><h4>Sales-order queue</h4><div class="table-responsive"><table class="table"><thead><tr><th>Order</th><th>PO/LPO</th><th>Status</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="js/axtor-api.js?v=20260726-repair1"></script><script>const B=window.AxtorAPI.getApiBaseUrl();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(B+'/api/v1/'+p,{headers:{Authorization:'Bearer '+(localStorage.getItem('axtorAuthToken')||'')}});const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data}async function load(){const d=await api('wholesale/dashboard');Object.keys(d).forEach(k=>{const e=document.querySelector('[data-k="'+k+'"]');if(e)e.textContent=d[k]});const rows=await api('wholesale/orders');document.querySelector('#rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.orderNo)}</td><td>${esc(x.customerPo)}</td><td>${esc(x.status)}</td><td>${Number(x.total).toFixed(2)}</td></tr>`).join('')}load().catch(e=>alert(e.message));</script></body></html>
