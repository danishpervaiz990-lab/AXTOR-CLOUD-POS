<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Workshop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#07140f;color:#eefaf2}.side{width:250px;position:fixed;inset:0 auto 0 0;background:#0b2118;padding:22px}.side a{display:block;color:#b8d9c6;padding:9px;text-decoration:none}.main{margin-left:250px;padding:25px}.glass{background:#123426;border:1px solid #285c45;border-radius:18px;padding:18px}.kpi{font-size:28px;font-weight:700}.table{color:#eefaf2}@media(max-width:800px){.side{position:static;width:auto}.main{margin:0}}</style></head><body><aside class="side"><h3>AXTOR</h3><p>Workshop & Garage</p><a href="workshop.html">Dashboard</a><a href="#vehicles">Vehicles</a><a href="#inspection">Inspection</a><a href="#estimate">Estimates</a><a href="#jobs">Job Cards</a><a href="#parts">Parts</a><a href="workshop-operations.html">Parts, Quality & Billing</a><a href="login.html">Sign out</a></aside><main class="main"><h1>Workshop Dashboard</h1><div class="row g-3 my-3"><div class="col-md-3"><div class="glass">Vehicles<div class="kpi" data-k="vehicles">0</div></div></div><div class="col-md-3"><div class="glass">Open Jobs<div class="kpi" data-k="openJobs">0</div></div></div><div class="col-md-3"><div class="glass">Awaiting Approval<div class="kpi" data-k="awaitingApproval">0</div></div></div><div class="col-md-3"><div class="glass">Service Bays<div class="kpi" data-k="serviceBays">0</div></div></div></div><div class="glass" id="jobs"><h4>Job-card queue</h4><div class="table-responsive"><table class="table"><thead><tr><th>Job</th><th>Status</th><th>Priority</th><th>Promised</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const B=(localStorage.getItem('axtorApiBase')||window.AXTOR_API_BASE||'').replace(/\/$/,'');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(B+'/api/v1/'+p,{headers:{Authorization:'Bearer '+(localStorage.getItem('axtorAuthToken')||'')}});const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data}async function load(){const d=await api('workshop/dashboard');Object.keys(d).forEach(k=>{const e=document.querySelector('[data-k="'+k+'"]');if(e)e.textContent=d[k]});const rows=await api('workshop/jobs');document.querySelector('#rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.jobNo)}</td><td>${esc(x.status)}</td><td>${esc(x.priority)}</td><td>${x.promisedAt?new Date(x.promisedAt).toLocaleDateString():''}</td></tr>`).join('')}load().catch(e=>alert(e.message));</script></body></html>
