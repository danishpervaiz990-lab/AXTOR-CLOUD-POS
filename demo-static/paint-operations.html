<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Paint Mixing Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#09130e;color:#f4fff8}.wrap{max-width:1200px;margin:auto;padding:24px}.glass{background:#14271c;border:1px solid #3f7656;border-radius:18px;padding:18px}.form-control{background:#0b1b12;color:#fff;border-color:#3f7656}.table{color:#fff}@media print{.no-print{display:none!important}body{background:#fff;color:#000}.glass{border:0;color:#000}.table{color:#000}}</style></head><body><div class="wrap"><div class="d-flex justify-content-between"><div><h1>Paint Mixing Operations</h1><p>Component stock, mix costing, quality and labels</p></div><div class="no-print"><a class="btn btn-outline-light" href="paint.html">Dashboard</a> <button class="btn btn-success" onclick="print()">Print</button></div></div><div class="row g-3"><div class="col-lg-5"><div class="glass no-print"><h4>Component stock</h4><form id="stock" class="d-grid gap-2"><input class="form-control" name="componentCode" placeholder="Component code" required><input class="form-control" name="componentName" placeholder="Component name" required><input class="form-control" name="quantityOnHand" type="number" step="0.0001" min="0" required><input class="form-control" name="unit" value="g" required><input class="form-control" name="averageCost" type="number" step="0.0001" min="0" placeholder="Average cost"><input class="form-control" name="minimumStock" type="number" step="0.0001" min="0" placeholder="Minimum stock"><button class="btn btn-success">Save component</button></form></div></div><div class="col-lg-7"><div class="glass"><h4>Component inventory</h4><table class="table"><thead><tr><th>Code</th><th>Component</th><th>On hand</th><th>Minimum</th></tr></thead><tbody id="rows"></tbody></table><h4>Mix summary</h4><pre id="report"></pre></div></div></div></div><script src="js/axtor-api.js"></script><script>const api=async(p,o={})=>{const r=await fetch((window.AXTOR_API_BASE||'')+'/api/v1/'+p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('axtorAuthToken'),...(o.headers||{})}}),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [ss,rp]=await Promise.all([api('paint/component-stock'),api('paint/reports')]);rows.innerHTML=ss.map(x=>`<tr><td>${esc(x.componentCode)}</td><td>${esc(x.componentName)}</td><td>${Number(x.quantityOnHand).toFixed(4)} ${esc(x.unit)}</td><td>${Number(x.minimumStock).toFixed(4)}</td></tr>`).join('');report.textContent=JSON.stringify(rp,null,2)}stock.onsubmit=async e=>{e.preventDefault();await api('paint/component-stock',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()};load().catch(e=>alert(e.message));</script></body></html>
