<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Restaurant Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#07140f;color:#eefaf3}.wrap{max-width:1200px;margin:auto;padding:24px}.glass{background:#102c21;border:1px solid #2d694e;border-radius:18px;padding:18px}.form-control,.form-select{background:#0b2118;color:#fff;border-color:#39795b}.table{color:#eefaf3}@media print{.no-print{display:none!important}body{background:#fff;color:#000}.glass{border:0;color:#000}.table{color:#000}}</style></head><body><div class="wrap"><div class="d-flex justify-content-between"><div><h1>Restaurant Operations</h1><p>Reservations, modifiers, wastage and reporting</p></div><div class="no-print"><a class="btn btn-outline-light" href="restaurant.html">Dashboard</a> <button class="btn btn-success" onclick="print()">Print</button></div></div><div class="row g-3"><div class="col-lg-5"><div class="glass no-print"><h4>New reservation</h4><form id="reservation" class="d-grid gap-2"><input class="form-control" name="customerName" placeholder="Customer name" required><input class="form-control" name="phone" placeholder="Phone"><input class="form-control" name="partySize" type="number" min="1" value="2" required><input class="form-control" name="reservedAt" type="datetime-local" required><button class="btn btn-success">Book reservation</button></form><hr><h4>Post wastage</h4><form id="wastage" class="d-grid gap-2"><input class="form-control" name="productId" placeholder="Product ID" required><input class="form-control" name="quantity" type="number" step="0.001" min="0.001" required><input class="form-control" name="reason" placeholder="Reason" required><button class="btn btn-warning">Post wastage</button></form></div></div><div class="col-lg-7"><div class="glass"><h4>Reservations</h4><table class="table"><thead><tr><th>No.</th><th>Customer</th><th>Party</th><th>Time</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><h4>30-day summary</h4><pre id="report"></pre></div></div></div></div><script src="js/axtor-api.js"></script><script>const api=async(p,o={})=>{const r=await fetch((window.AXTOR_API_BASE||'')+'/api/v1/'+p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('axtorAuthToken'),...(o.headers||{})}}),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j.data};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [rs,rp]=await Promise.all([api('restaurant/reservations'),api('restaurant/reports')]);rows.innerHTML=rs.map(x=>`<tr><td>${esc(x.reservationNo)}</td><td>${esc(x.customerName)}</td><td>${x.partySize}</td><td>${new Date(x.reservedAt).toLocaleString()}</td><td>${esc(x.status)}</td></tr>`).join('');report.textContent=JSON.stringify(rp,null,2)}reservation.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('restaurant/reservations',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.target.reset();load()};wastage.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('restaurant/wastage',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(Object.fromEntries(f))});e.target.reset();load()};load().catch(e=>alert(e.message));</script></body></html>
