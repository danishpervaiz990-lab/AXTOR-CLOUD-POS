<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wholesale Final Controls</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/dedicated-industry.css"><style>@media print{nav,.no-print,form,button{display:none!important} body{background:#fff;color:#000}}</style></head><body><nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="wholesale.html">AXTOR · Wholesale Final Controls</a><button class="btn btn-outline-light" onclick="print()">Print</button></nav><main class="container py-4"><h1>Wholesale Final Controls</h1><p class="text-secondary">Final Release D operational controls.</p><section class="card mb-3"><div class="card-body"><h2 class="h5">Credit Profile</h2><form data-api="/api/v1/wholesale/credit-profiles" data-method="PUT"><div class="row g-3"><div class="col-md-4"><label class="form-label">Customer ID</label><input class="form-control" name="customerId" required></div><div class="col-md-4"><label class="form-label">Credit Limit</label><input class="form-control" name="creditLimit" required></div><div class="col-md-4"><label class="form-label">Credit Days</label><input class="form-control" name="creditDays" ></div><div class="col-12"><button class="btn btn-success">Save</button></div></div><pre class="result mt-3"></pre></form></div></section><section class="card mb-3"><div class="card-body"><h2 class="h5">Proof of Delivery</h2><form data-api="/api/v1/wholesale/dispatches/{id}/proof-of-delivery" data-method="POST" data-id-field="dispatchId"><div class="row g-3"><div class="col-md-4"><label class="form-label">Dispatch ID</label><input class="form-control" name="dispatchId" required></div><div class="col-md-4"><label class="form-label">Receiver Name</label><input class="form-control" name="receiverName" required></div><div class="col-md-4"><label class="form-label">Signature Reference</label><input class="form-control" name="signatureReference" ></div><div class="col-12"><button class="btn btn-success">Save</button></div></div><pre class="result mt-3"></pre></form></div></section><section class="card mt-4"><div class="card-body"><div class="d-flex gap-2 no-print"><button class="btn btn-outline-success" data-get="/api/v1/wholesale/receivables/ageing">Receivable Ageing</button><button class="btn btn-outline-success" data-get="/api/v1/wholesale/reports">Load Reports</button></div><pre id="report" class="mt-3 text-wrap"></pre></div></section></main><script src="js/axtor-api.js"></script><script src="js/release-d-final.js"></script></body></html>
