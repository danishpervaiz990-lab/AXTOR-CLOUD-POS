<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Workshop Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#0b1117;color:#f1f6fb}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#172430;color:#f1f6fb;border:1px solid #35536b}.form-control{background:#101c25;color:white;border-color:#35536b}@media print{nav,.no-print{display:none!important}body{background:white;color:black}.card{background:white;color:black}}</style></head><body><nav class="p-3"><a class="btn btn-outline-light" href="workshop.html">Dashboard</a></nav><main class="wrap"><h1>Workshop Parts, Quality & Billing</h1><div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h4>Reserve Part</h4><form data-endpoint="/api/v1/workshop/jobs/{id}/parts/reserve" data-id-field="jobId"><input class="form-control mb-2" name="jobId" placeholder="Job card ID" required><input class="form-control mb-2" name="productId" placeholder="Product ID" required><input class="form-control mb-2" name="quantity" type="number" step="0.001" required><button class="btn btn-primary">Reserve</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Quality Check</h4><form data-endpoint="/api/v1/workshop/jobs/{id}/quality-checks" data-id-field="jobId"><input class="form-control mb-2" name="jobId" placeholder="Job card ID" required><select class="form-control mb-2" name="result"><option>passed</option><option>failed</option><option>rework</option></select><textarea class="form-control mb-2" name="notes" placeholder="Notes"></textarea><button class="btn btn-primary">Post check</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Create Invoice</h4><form data-endpoint="/api/v1/workshop/jobs/{id}/invoices" data-id-field="jobId"><input class="form-control mb-2" name="jobId" placeholder="Job card ID" required><input class="form-control mb-2" name="total" type="number" step="0.01" placeholder="Total"><button class="btn btn-primary">Create invoice</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Workshop Report</h4><button class="btn btn-primary" data-load="/api/v1/workshop/reports">Load report</button><button class="btn btn-outline-light no-print" onclick="print()">Print job summary</button><pre id="report" class="mt-2"></pre></div></div></div></main><script src="js/axtor-api.js"></script><script src="js/release-d-remaining.js"></script></body></html>
