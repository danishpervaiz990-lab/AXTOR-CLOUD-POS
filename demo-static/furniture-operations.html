<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axtor Furniture Operations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#07140f;color:#eefaf2}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#123426;color:#eefaf2;border:1px solid #285c45}.form-control{background:#102c21;color:white;border-color:#2d694e}@media print{nav,.no-print{display:none!important}body{background:white;color:black}.card{border:1px solid #aaa;color:black;background:white}}</style></head><body><nav class="p-3"><a class="btn btn-outline-light" href="furniture.html">Dashboard</a></nav><main class="wrap"><h1>Furniture Orders, Installation & Warranty</h1><div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h4>Order Approval</h4><form data-endpoint="/api/v1/furniture/orders/{id}/approvals" data-id-field="orderId"><input class="form-control mb-2" name="orderId" placeholder="Order ID" required><select class="form-control mb-2" name="status"><option>approved</option><option>rejected</option></select><input class="form-control mb-2" name="notes" placeholder="Approval notes"><button class="btn btn-success">Save approval</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Schedule Installation</h4><form data-endpoint="/api/v1/furniture/installations"><input class="form-control mb-2" name="deliveryId" placeholder="Delivery ID" required><input class="form-control mb-2" type="datetime-local" name="scheduledAt" required><input class="form-control mb-2" name="technicianName" placeholder="Technician"><button class="btn btn-success">Schedule</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Warranty Claim</h4><form data-endpoint="/api/v1/furniture/warranty-claims"><input class="form-control mb-2" name="warrantyId" placeholder="Warranty ID" required><textarea class="form-control mb-2" name="issue" placeholder="Issue" required></textarea><button class="btn btn-success">Open claim</button><pre class="result mt-2"></pre></form></div></div><div class="col-lg-6"><div class="card p-3"><h4>Operational Report</h4><button class="btn btn-success" data-load="/api/v1/furniture/reports">Load report</button><button class="btn btn-outline-light no-print" onclick="print()">Print</button><pre id="report" class="mt-2"></pre></div></div></div></main><script src="js/axtor-api.js"></script><script src="js/release-d-remaining.js"></script></body></html>
