CREATE TABLE "gym_programs" ("id" TEXT PRIMARY KEY,"business_id" TEXT NOT NULL,"code" TEXT NOT NULL,"name" TEXT NOT NULL,"description" TEXT,"duration_weeks" INTEGER NOT NULL DEFAULT 4,"price" DECIMAL(14,2) NOT NULL DEFAULT 0,"active" BOOLEAN NOT NULL DEFAULT true,"created_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,"updated_at" TIMESTAMP(3) NOT NULL);
CREATE UNIQUE INDEX "gym_programs_business_id_code_key" ON "gym_programs"("business_id","code"); CREATE INDEX "gym_programs_business_id_active_idx" ON "gym_programs"("business_id","active");
