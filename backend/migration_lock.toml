CREATE TABLE "gym_measurements" ("id" TEXT PRIMARY KEY,"business_id" TEXT NOT NULL,"member_id" TEXT NOT NULL,"measured_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,"weight_kg" DECIMAL(8,2),"height_cm" DECIMAL(8,2),"body_fat_pct" DECIMAL(6,2),"waist_cm" DECIMAL(8,2),"goal_note" TEXT,"recorded_by" TEXT); CREATE INDEX "gym_measurements_business_member_measured_idx" ON "gym_measurements"("business_id","member_id","measured_at");
