CREATE TABLE "clinic_specialties" ("id" TEXT PRIMARY KEY,"business_id" TEXT NOT NULL,"code" TEXT NOT NULL,"name" TEXT NOT NULL,"active" BOOLEAN NOT NULL DEFAULT true); CREATE UNIQUE INDEX "clinic_specialties_business_code_key" ON "clinic_specialties"("business_id","code");
